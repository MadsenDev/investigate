name: Vitni 2 review history wiring

on:
  push:
    branches: [agent/vitni-2-attention-evidence]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitni-2-attention-evidence
          fetch-depth: 0
      - name: Wire history panel
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/renderer/src/v2/workspaces/AttentionWorkspace.tsx')
          text = p.read_text()
          import_marker = "import { ATTENTION_REASON_COPY } from '../features/attention/model';\n"
          if import_marker not in text:
              raise SystemExit('Import marker missing')
          text = text.replace(import_marker, import_marker + "import { ReviewHistory } from '../components/ReviewHistory';\n", 1)
          marker = "                      </div>\n                    </section>\n                  </div>\n                </div>\n              ) : null}"
          insertion = "                      </div>\n\n                      <ReviewHistory\n                        assertionId={assertion.id}\n                        refreshKey={`${assertion.reviewed_at ?? 0}:${assertion.source_id}:${assertion.confidence}`}\n                      />\n                    </section>\n                  </div>\n                </div>\n              ) : null}"
          if marker not in text:
              raise SystemExit('History insertion marker missing')
          p.write_text(text.replace(marker, insertion, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/vitni2-review-history-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/renderer/src/v2/workspaces/AttentionWorkspace.tsx
          git commit -m "feat: show assertion review history"
          git push origin HEAD:agent/vitni-2-attention-evidence
