name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release metadata
        run: npm run release:check

      - name: Resolve upgraded dependency graph
        if: github.head_ref == 'agent/modernize-stack'
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Commit upgraded lockfile
        if: github.head_ref == 'agent/modernize-stack'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh modern dependency lockfile'
            git push origin HEAD:agent/modernize-stack
          fi

      # Native better-sqlite3 rebuild is deliberately skipped during iterative
      # compiler/lint migration checks. The final cleaned-up CI run restores the
      # normal `npm ci` postinstall and proves the Electron 43 native build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply modernization source fixes
        if: github.head_ref == 'agent/modernize-stack'
        run: |
          node tools/apply-modernization-fixes.mjs
          git add app/main/projectManager.ts app/main/services/ollama.ts \
            app/renderer/src/components/ProjectSettingsModal.tsx \
            app/renderer/src/components/GraphWorkspace.tsx \
            app/renderer/src/components/TitleBar.tsx tsconfig.base.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: adapt source to modern tooling'
            git push origin HEAD:agent/modernize-stack
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
