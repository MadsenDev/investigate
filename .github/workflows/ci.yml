name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release metadata
        run: npm run release:check

      # Temporary for the stack-modernization PR: the old lock graph spans Vite 5
      # and React 18, so resolve the modern dependency graph from package.json
      # rather than asking npm to incrementally reconcile incompatible peers.
      - name: Resolve upgraded dependency graph
        if: github.head_ref == 'agent/modernize-stack'
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Commit upgraded lockfile
        if: github.head_ref == 'agent/modernize-stack'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json is already current.'
          else
            git commit -m 'build: refresh modern dependency lockfile'
            git push origin HEAD:agent/modernize-stack
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
