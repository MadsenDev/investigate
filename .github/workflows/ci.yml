name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release metadata
        run: npm run release:check

      # Temporary for the stack-modernization PR: resolve the new dependency
      # graph in CI so npm, not hand editing, produces package-lock.json.
      - name: Resolve upgraded dependency graph
        if: github.head_ref == 'agent/modernize-stack'
        run: npm install --package-lock-only --ignore-scripts

      - name: Capture upgraded lockfile
        if: github.head_ref == 'agent/modernize-stack'
        uses: actions/upload-artifact@v4
        with:
          name: modernized-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
