name: Vitni 2 attention wiring

on:
  push:
    branches: [agent/vitni-2-attention-evidence]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitni-2-attention-evidence
          fetch-depth: 0
      - name: Wire assertions and sources into Needs Attention
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/renderer/src/v2/Vitni2App.tsx')
          text = p.read_text()
          old = "content = <AttentionWorkspace items={attentionItems} onSelect={handleSelect} onRefresh={refresh} />;"
          new = "content = <AttentionWorkspace items={attentionItems} assertions={assertions} sources={sources} onSelect={handleSelect} onNavigate={setWorkspace} onRefresh={refresh} />;"
          if old not in text:
              raise SystemExit('Expected AttentionWorkspace wiring not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/vitni2-attention-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/renderer/src/v2/Vitni2App.tsx
          git commit -m "feat: wire evidence context into Needs Attention"
          git push origin HEAD:agent/vitni-2-attention-evidence
