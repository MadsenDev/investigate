name: Vitni 2 report provenance wiring

on:
  push:
    branches: [agent/vitni-2-findings-reporting]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitni-2-findings-reporting
          fetch-depth: 0
      - name: Share provenance writer with narrative reports
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/main/ipc/findings.ts')
          text = p.read_text()
          marker = "export function registerFindingHandlers(ipcMain: IpcMain, projectManager: ProjectManager) {\n"
          helper = """export async function writeFindingsEvidenceBundle(\n  db: DbConnection,\n  projectManager: ProjectManager,\n  outputDir: string\n): Promise<{ findingCount: number; sourceCount: number }> {\n  const bundle = findingBundle(db, projectManager);\n  await fsp.mkdir(outputDir, { recursive: true });\n  await fsp.writeFile(path.join(outputDir, 'findings-evidence.json'), `${JSON.stringify(bundle, null, 2)}\\n`, 'utf8');\n  await fsp.writeFile(path.join(outputDir, 'findings-evidence.md'), markdownForBundle(bundle), 'utf8');\n  return { findingCount: bundle.findings.length, sourceCount: bundle.sources.length };\n}\n\n"""
          if 'export async function writeFindingsEvidenceBundle' not in text:
              if marker not in text: raise SystemExit('finding register marker missing')
              text = text.replace(marker, helper + marker, 1)

          old = """    const bundle = findingBundle(db, projectManager);\n    const stamp = new Date().toISOString().replace(/[:.]/g, '-');\n    const outputDir = path.join(projectManager.getRoot(), projectManager.getManifest().paths.exports, `findings-evidence-${stamp}`);\n    await fsp.mkdir(outputDir, { recursive: true });\n    await fsp.writeFile(path.join(outputDir, 'findings-evidence.json'), `${JSON.stringify(bundle, null, 2)}\\n`, 'utf8');\n    await fsp.writeFile(path.join(outputDir, 'findings-evidence.md'), markdownForBundle(bundle), 'utf8');\n    recordFindingAudit(db, bundle.case.id, 'findings.export', `${bundle.findings.length} finding(s), ${bundle.sources.length} source(s)`);\n    return { outputDir, findingCount: bundle.findings.length, sourceCount: bundle.sources.length };\n"""
          new = """    const stamp = new Date().toISOString().replace(/[:.]/g, '-');\n    const outputDir = path.join(projectManager.getRoot(), projectManager.getManifest().paths.exports, `findings-evidence-${stamp}`);\n    const result = await writeFindingsEvidenceBundle(db, projectManager, outputDir);\n    db.prepare(\n      `INSERT INTO audit (id, action, subject_kind, subject_id, actor, reason, transform_run_id, created_at)\n       VALUES (?, 'findings.export', 'case', ?, 'user', ?, NULL, ?)`\n    ).run(randomUUID(), projectManager.getManifest().id, `${result.findingCount} finding(s), ${result.sourceCount} source(s)`, Math.floor(Date.now() / 1000));\n    return { outputDir, ...result };\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const result = await writeFindingsEvidenceBundle' not in text:
              raise SystemExit('standalone export marker missing')
          p.write_text(text)

          p = Path('app/main/ipc/index.ts')
          text = p.read_text()
          text = text.replace(
              "import { registerFindingHandlers } from './findings';",
              "import { registerFindingHandlers, writeFindingsEvidenceBundle } from './findings';",
              1
          )
          needle = "await fsp.writeFile(path.join(outDir, 'report.html'), html, 'utf8');"
          replacement = needle + "\n        await writeFindingsEvidenceBundle(db, projectManager, outDir);"
          count = text.count(needle)
          if count == 0 and 'writeFindingsEvidenceBundle(db, projectManager, outDir)' not in text:
              raise SystemExit('report write marker missing')
          if count:
              text = text.replace(needle, replacement)
          p.write_text(text)
          print(f'Integrated provenance into {count} report HTML write paths')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/vitni2-report-provenance-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/main/ipc/findings.ts app/main/ipc/index.ts
          git commit -m "feat: include findings provenance with reports"
          git push origin HEAD:agent/vitni-2-findings-reporting
