name: Modernize lockfile

# Temporary branch-only helper. Removed once npm has produced the upgraded lockfile.
on:
  push:
    branches: [agent/modernize-stack]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modernize-stack
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Resolve dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: refresh dependency lockfile'
          git push origin HEAD:agent/modernize-stack
