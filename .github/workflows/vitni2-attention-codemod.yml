name: Vitni 2 attention codemod

on:
  push:
    branches: [agent/vitni-2-attention-evidence]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitni-2-attention-evidence
          fetch-depth: 0
      - name: Extend assertion update contract
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'app/main/ipc/index.ts',
              "interface UpdateAssertionPayload {\n  value?: Record<string, unknown>;\n  confidence?: AssertionRecord['confidence'];",
              "interface UpdateAssertionPayload {\n  value?: Record<string, unknown>;\n  source_id?: string;\n  confidence?: AssertionRecord['confidence'];"
          )
          replace(
              'app/main/ipc/index.ts',
              "      if (updates.confidence !== undefined) {\n        updatesList.push('confidence = @confidence');\n        params.confidence = updates.confidence;\n      }",
              "      if (updates.source_id !== undefined) {\n        const source = db.prepare('SELECT id FROM source WHERE id = ? LIMIT 1').get(updates.source_id) as { id: string } | undefined;\n        if (!source) {\n          throw new Error('Cannot attach assertion to a source that does not exist');\n        }\n        updatesList.push('source_id = @source_id');\n        params.source_id = updates.source_id;\n      }\n\n      if (updates.confidence !== undefined) {\n        updatesList.push('confidence = @confidence');\n        params.confidence = updates.confidence;\n      }"
          )
          replace(
              'app/preload/preload.ts',
              "updates: { value?: Record<string, unknown>; confidence?: AssertionRecord['confidence'] }",
              "updates: { value?: Record<string, unknown>; source_id?: string; confidence?: AssertionRecord['confidence']; review_state?: AssertionRecord['review_state']; review_note?: string | null; reviewed_by?: string | null; reviewed_at?: number | null }"
          )
          for path in ['app/renderer/src/services/piBridge.ts', 'app/renderer/src/global.d.ts']:
              replace(
                  path,
                  "      value?: Record<string, unknown>;\n      confidence?: AssertionRecord['confidence'];",
                  "      value?: Record<string, unknown>;\n      source_id?: string;\n      confidence?: AssertionRecord['confidence'];"
              )
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/vitni2-attention-codemod.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/main/ipc/index.ts app/preload/preload.ts app/renderer/src/services/piBridge.ts app/renderer/src/global.d.ts
          git commit -m "feat: allow assertions to relink evidence sources"
          git push origin HEAD:agent/vitni-2-attention-evidence
